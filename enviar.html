<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar producción · Enrique Neri</title><style>
:root{--bg:#07090c;--panel:#111820;--line:#28343e;--ink:#efede8;--muted:#98a3ac;--gold:#e8a33d;--teal:#3fa9a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Inter,system-ui,sans-serif}.wrap{max-width:680px;margin:auto;padding:38px 18px 70px}.ey{font:11px ui-monospace,monospace;color:var(--teal);letter-spacing:.14em}h1{font-size:44px;font-weight:350;line-height:1.05;margin:12px 0}p{color:var(--muted);line-height:1.6}.card{background:var(--panel);border:1px solid var(--line);padding:22px;margin-top:24px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:var(--muted);font-size:13px;margin:13px 0}input,select,textarea{display:block;width:100%;margin-top:7px;padding:13px;background:#0a1015;border:1px solid var(--line);color:var(--ink);font:16px inherit}button{width:100%;padding:15px;border:1px solid var(--gold);background:var(--gold);color:#111;font:600 14px inherit;cursor:pointer;margin-top:14px}.msg{white-space:pre-wrap;color:var(--muted);margin-top:14px}.back{color:var(--gold);text-decoration:none}@media(max-width:560px){.row{grid-template-columns:1fr}h1{font-size:36px}}
</style></head><body><main class="wrap"><div class="ey">PRODUCCIÓN INMOBILIARIA</div><h1>Envía tu material<br>sin salir del proceso.</h1><p>Primero registramos tu pedido. Después recibirás tu espacio privado para subir archivos, consultar el avance, completar facturación y descargar la entrega.</p><section class="card"><div class="row"><label>Nombre completo<input id="nombre" autocomplete="name"></label><label>Celular con WhatsApp<input id="telefono" inputmode="tel" autocomplete="tel"></label></div><div class="row"><label>Correo<input id="correo" type="email" autocomplete="email"></label><label>Servicio<select id="paquete"><option>Solo edición</option><option>Pieza única</option><option>Plan Estudio</option><option>Patrimonial</option></select></label></div><label>Propiedad o título de la pieza<input id="titulo"></label><label>Dirección de la propiedad<input id="direccion"></label><label>Notas<textarea id="notas" rows="4" placeholder="Cuéntame qué material tienes y qué necesitas"></textarea></label><label><input id="factura" type="checkbox" style="display:inline;width:auto;margin-right:8px">Necesito factura</label><button id="submit" onclick="crear()">Crear mi pedido y subir archivos</button><div id="msg" class="msg"></div></section><p><a class="back" href="index.html">← Regresar a paquetes</a></p></main><script>
var PRODUCCION_API='https://intranetmetodonerirealtor.vercel.app/api/produccion';
async function crear(){submit.disabled=true;msg.textContent='Creando tu espacio privado…';try{const r=await fetch(PRODUCCION_API+'?action=crear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:nombre.value,telefono:telefono.value,correo:correo.value,paquete:paquete.value,titulo:titulo.value,direccion:direccion.value,notas:notas.value,requiereFactura:factura.checked})});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo crear el pedido');msg.textContent='Pedido '+d.folio+' creado. Abriendo tu espacio…';location.href=d.link}catch(e){msg.textContent=e.message;submit.disabled=false}}
</script></body></html>
